# Pila local completa (doc 04 §11.2, D-H0-16). Se arranca desde la raíz: `docker compose up --wait`.
#
# Orden: secrets -> db -> migrate -> seed -> api -> web. Cada paso espera al anterior; `geodata` corre aparte y `seed` lo espera.
#   secrets  genera al azar, solo la primera vez, las contraseñas y el secreto CSRF (volumen `secrets`).
#   geodata  un solo uso: la primera vez descarga a su volumen el DEM Copernicus GLO-30 (~466 MB) y un extracto PMTiles de los
#            Pirineos con sus fuentes y sprites (H1, P2); las siguientes no descarga nada. Si algo falla, avisa y la pila
#            arranca igual (sin mapa base o con OUTSIDE_COVERAGE). Es lo único que sale a Internet al arrancar.
#   db       PostgreSQL 16 + PostGIS; el primer arranque aplica la 0001 y los roles como superusuario.
#   migrate  migraciones 0002-0014 como onway_owner.
#   seed     datos de demostración ficticios (R-10), idempotente.
#   api      NestJS como onway_app (se niega a arrancar con un rol que salte la seguridad por filas).
#   web      Caddy: sirve la web y hace de proxy de /api. Único puerto publicado: 127.0.0.1:8080.
#
# Si borras uno de los volúmenes `secrets` o `db-data`, borra también el otro (`docker compose down -v`):
# las contraseñas de la base de datos se fijan en su primer arranque.

x-hardened: &hardened
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

# Correo (H5-acceso, D-A7): el adaptador de consola escribe en el registro de `api` el enlace de recuperación de contraseña (no sale ningún
# correo). Lo usan `api` y `worker`, que arrancan `MailModule` y con `NODE_ENV=production` exigen las tres variables.
#   MAILER_ALLOW_CONSOLE es el interruptor de ESTA pila (local, E2E y CI): el despliegue de H7 NO lo fija, usará Resend.
#   PUBLIC_BASE_URL sigue el puerto publicado (ONWAY_HTTP_PORT, 18080 en el E2E); ONWAY_PUBLIC_URL del .env lo sustituye.
x-mail-env: &mail-env
  MAILER: console
  MAILER_ALLOW_CONSOLE: 'true'
  PUBLIC_BASE_URL: ${ONWAY_PUBLIC_URL:-http://localhost:${ONWAY_HTTP_PORT:-8080}}

x-node-job: &node-job
  <<: *hardened
  build: &api-build
    context: ..
    dockerfile: infra/docker/api.Dockerfile
  image: onway/api:local
  read_only: true
  restart: 'no'
  mem_limit: 384m
  networks: [data]
  environment: &db-env
    DB_HOST: db
    DB_PORT: '5432'
    DB_NAME: onway

services:
  secrets:
    <<: *hardened
    image: node:24.22.2-alpine3.24
    entrypoint: ['/bin/sh', '/scripts/gen-secrets.sh']
    read_only: true
    restart: 'no'
    mem_limit: 32m
    network_mode: none
    volumes:
      - secrets:/secrets
      - ./scripts/gen-secrets.sh:/scripts/gen-secrets.sh:ro

  db:
    <<: *hardened
    image: postgis/postgis:16-3.4
    # Solo lo imprescindible para arrancar PostgreSQL (cambio de propietario y de usuario).
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    restart: unless-stopped
    mem_limit: 768m
    shm_size: 128m
    networks: [data]
    # Sin `ports`: la base de datos no se publica; solo la ven los servicios de la red `data`.
    command: ['postgres', '-c', 'shared_buffers=128MB', '-c', 'max_connections=40', '-c', 'work_mem=8MB']
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: onway
      POSTGRES_PASSWORD_FILE: /run/onway/admin/password
      ONWAY_MIGRATION_0001: /onway/0001_extensions_roles.sql
      ONWAY_OWNER_PASSWORD_FILE: /run/onway/owner/password
      ONWAY_APP_PASSWORD_FILE: /run/onway/app/password
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init/10-onway-roles.sh:/docker-entrypoint-initdb.d/20-onway-roles.sh:ro
      - ../db/migrations/0001_extensions_roles.sql:/onway/0001_extensions_roles.sql:ro
      - { type: volume, source: secrets, target: /run/onway/admin, read_only: true, volume: { subpath: admin } }
      - { type: volume, source: secrets, target: /run/onway/owner, read_only: true, volume: { subpath: owner } }
      - { type: volume, source: secrets, target: /run/onway/app, read_only: true, volume: { subpath: app } }
    tmpfs:
      - /run/postgresql
      - /tmp
    read_only: true
    depends_on:
      secrets:
        condition: service_completed_successfully
    healthcheck:
      # Por TCP y no por el socket: durante el arranque inicial el servidor temporal solo escucha en el socket.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U postgres -d onway']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  migrate:
    <<: *node-job
    command: ['node', 'dist/src/cli/migrate.js']
    environment:
      <<: *db-env
      DB_OWNER_PASSWORD_FILE: /run/onway/owner/password
    volumes:
      - { type: volume, source: secrets, target: /run/onway/owner, read_only: true, volume: { subpath: owner } }
    depends_on:
      db:
        condition: service_healthy

  geodata:
    <<: *hardened
    build:
      context: ..
      dockerfile: infra/docker/geodata.Dockerfile
    image: onway/geodata:local
    read_only: true
    restart: 'no'
    mem_limit: 256m
    # Necesita salir a Internet (copernicus-dem-30m.s3.amazonaws.com, build.protomaps.com, github.com).
    networks: [edge]
    tmpfs:
      - /tmp
    volumes:
      - geodata:/geodata

  # Motor de rutas (H3). `routing-data` deja en el volumen `routing-data` la red de caminos (extractos de Geofabrik recortados a los
  # Pirineos, ~1,3 GB la primera vez) y las teselas de altitud de OnWay; `routing` es GraphHopper sobre ellas. Si algo falla, la pila
  # sigue y la API responde ROUTING_UNAVAILABLE.
  routing-data:
    <<: *hardened
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
      target: routing-data
    image: onway/routing-data:local
    read_only: true
    restart: 'no'
    mem_limit: 2g
    # Sale a Internet (download.geofabrik.de).
    networks: [edge]
    tmpfs:
      - /tmp
    environment:
      ELEVATION_DEM_DIR: /geodata/dem
    volumes:
      - geodata:/geodata:ro
      - routing-data:/routing
    depends_on:
      geodata:
        condition: service_completed_successfully

  routing:
    <<: *hardened
    build:
      context: ..
      dockerfile: infra/docker/routing.Dockerfile
    image: onway/routing:local
    read_only: true
    restart: unless-stopped
    mem_limit: 3g
    networks: [data]
    tmpfs:
      - /tmp
    environment:
      ROUTING_HEAP: 2g
      ROUTING_OSM_FILE: ${ROUTING_OSM_FILE:-/data/network/pyrenees.osm.pbf}
      ROUTING_HGT_DIR: /data/hgt
    volumes:
      - routing-data:/data:ro
      - routing-graph:/graph
    depends_on:
      routing-data:
        condition: service_completed_successfully
    healthcheck:
      # En reposo (sin red de caminos, /tmp/degraded) el contenedor se da por sano: la API sabe si hay motor porque lo llama.
      test: ['CMD-SHELL', 'test -e /tmp/degraded || curl -fsS http://127.0.0.1:8989/health']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15m

  seed:
    <<: *node-job
    command: ['node', 'dist/src/cli/seed.js']
    environment:
      <<: *db-env
      DB_OWNER_PASSWORD_FILE: /run/onway/owner/password
      ELEVATION_DEM_DIR: /geodata/dem
      # La semilla cifra los perfiles de demostración con las mismas claves que la API (H5-perfil).
      SENSITIVE_KEY_FILE: /run/onway/sensitive/key
      DOCUMENT_HASH_KEY_FILE: /run/onway/fingerprint/key
      FILES_DIR: /files
    volumes:
      - { type: volume, source: secrets, target: /run/onway/owner, read_only: true, volume: { subpath: owner } }
      - { type: volume, source: secrets, target: /run/onway/sensitive, read_only: true, volume: { subpath: sensitive } }
      - { type: volume, source: secrets, target: /run/onway/fingerprint, read_only: true, volume: { subpath: fingerprint } }
      - geodata:/geodata:ro
      # La semilla guarda el certificado PDF inventado de rescatista1 donde lo lee la API (H5-habilidades).
      - files:/files
    depends_on:
      migrate:
        condition: service_completed_successfully
      geodata:
        condition: service_completed_successfully

  api:
    <<: *hardened
    build: *api-build
    image: onway/api:local
    read_only: true
    restart: unless-stopped
    mem_limit: 512m
    networks: [data, edge]
    environment:
      <<: [*db-env, *mail-env]
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '3000'
      NODE_OPTIONS: --max-old-space-size=384
      DB_APP_PASSWORD_FILE: /run/onway/app/password
      CSRF_SECRET_FILE: /run/onway/csrf/secret
      # Documento y dirección, cifrados (H5-perfil). Las claves no están en la base ni en sus copias (doc 04 §6.3).
      SENSITIVE_KEY_FILE: /run/onway/sensitive/key
      DOCUMENT_HASH_KEY_FILE: /run/onway/fingerprint/key
      # Altitud: teselas GLO-30 locales y, fuera de ellas, Open-Meteo. Dirección: Nominatim. Las URL y el contacto se pueden cambiar (D-H1-15).
      ELEVATION_DEM_DIR: /geodata/dem
      OPEN_METEO_ELEVATION_URL: ${OPEN_METEO_ELEVATION_URL:-https://api.open-meteo.com/v1/elevation}
      OPEN_METEO_FORECAST_URL: ${OPEN_METEO_FORECAST_URL:-https://api.open-meteo.com/v1/forecast}
      NOMINATIM_URL: ${NOMINATIM_URL:-https://nominatim.openstreetmap.org/search}
      NOMINATIM_CONTACT: ${NOMINATIM_CONTACT:-}
      # Motor de rutas (H3): si no está, las operaciones que lo usan responden ROUTING_UNAVAILABLE y el resto sigue.
      ROUTING_URL: http://routing:8989
    volumes:
      - { type: volume, source: secrets, target: /run/onway/app, read_only: true, volume: { subpath: app } }
      - { type: volume, source: secrets, target: /run/onway/csrf, read_only: true, volume: { subpath: csrf } }
      - { type: volume, source: secrets, target: /run/onway/sensitive, read_only: true, volume: { subpath: sensitive } }
      - { type: volume, source: secrets, target: /run/onway/fingerprint, read_only: true, volume: { subpath: fingerprint } }
      - geodata:/geodata:ro
      # Archivos subidos (GPX/KML para importar rutas, H2). La API es la única que escribe; `down -v` los borra con la pila.
      - files:/files
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/v1/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # El mismo código que la `api` con otra entrada (AD-05, H3): toma los trabajos de cálculo de la cola (pg-boss, en la propia base de
  # datos) y los lleva a cabo. No publica ningún puerto; solo escucha su comprobación de salud en la red interna.
  worker:
    <<: *hardened
    build: *api-build
    image: onway/api:local
    command: ['node', 'dist/src/worker.js']
    read_only: true
    restart: unless-stopped
    mem_limit: 512m
    networks: [data]
    tmpfs:
      - /tmp
    environment:
      <<: [*db-env, *mail-env]
      NODE_ENV: production
      HOST: 0.0.0.0
      WORKER_PORT: '3001'
      NODE_OPTIONS: --max-old-space-size=384
      DB_APP_PASSWORD_FILE: /run/onway/app/password
      CSRF_SECRET_FILE: /run/onway/csrf/secret
      ELEVATION_DEM_DIR: /geodata/dem
      ROUTING_URL: http://routing:8989
    volumes:
      - { type: volume, source: secrets, target: /run/onway/app, read_only: true, volume: { subpath: app } }
      - { type: volume, source: secrets, target: /run/onway/csrf, read_only: true, volume: { subpath: csrf } }
      - geodata:/geodata:ro
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  web:
    <<: *hardened
    # Caddy necesita su capacidad de red al arrancar aunque 8080 no sea un puerto privilegiado.
    cap_add: [NET_BIND_SERVICE]
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
    image: onway/web:local
    read_only: true
    restart: unless-stopped
    mem_limit: 128m
    networks: [edge]
    tmpfs:
      - /tmp
    volumes:
      # Extracto PMTiles, fuentes y sprites (/geodata/basemap); el Caddyfile los sirve desde T6.
      - geodata:/geodata:ro
    ports:
      # Solo tu equipo (HTTP, contraseña de demostración pública). `ONWAY_HTTP_BIND`/`ONWAY_HTTP_PORT` en .env.example.
      - '${ONWAY_HTTP_BIND:-127.0.0.1}:${ONWAY_HTTP_PORT:-8080}:8080'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # Atraviesa el proxy: comprueba a la vez Caddy y la API.
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/api/v1/health']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

networks:
  # Base de datos, migraciones y semilla: sin salida a Internet.
  data:
    internal: true
  edge: {}

volumes:
  secrets: {}
  db-data: {}
  # GPX y KML subidos por los coordinadores (contenido en disco, fila en la tabla `files`). Se copia con el volumen en una copia de seguridad.
  files: {}
  # DEM y mapa base descargados por `geodata`. Se puede borrar sola (`docker volume rm onway_geodata`): se vuelve a descargar.
  geodata: {}
  # Red de caminos y teselas de altitud del motor de rutas (`routing-data`); el grafo que construye GraphHopper vive en `routing-graph`. Se regeneran solos.
  routing-data: {}
  routing-graph: {}
